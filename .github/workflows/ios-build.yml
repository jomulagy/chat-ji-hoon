name: iOS build

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and sync Capacitor
        run: pnpm run ios:prepare

      - name: Install CocoaPods
        run: |
          if ! command -v pod >/dev/null 2>&1; then
            brew install cocoapods
          fi

      - name: Install iOS pods
        run: pod install --project-directory=ios/App

      - name: Build unsigned iOS app
        run: >-
          xcodebuild
          -workspace ios/App/App.xcworkspace
          -scheme App
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath ios/App/build
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Save build artifact
        uses: actions/upload-artifact@v4
        with:
          name: chat-jihun-ios-app-unsigned
          path: ios/App/build/Build/Products/Release-iphoneos/App.app
          if-no-files-found: error
